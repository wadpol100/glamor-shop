    <style>
        body { margin: 0; font-family: 'Kanit', sans-serif; display: flex; background-color: #fff0f5; }
        
        /* เมนูซ้าย */
        .sidebar { width: 260px; background: #333; color: white; height: 100vh; position: fixed; padding-top: 20px; z-index: 1000; }
        .sidebar h2 { text-align: center; color: #ff69b4; margin-bottom: 30px; }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar ul li { padding: 18px 25px; cursor: pointer; border-bottom: 1px solid #444; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .sidebar ul li:hover { background: #ff69b4; padding-left: 35px; }

        /* โลโก้มุมขวาบน */
        .logo-top-right { position: fixed; top: 20px; right: 20px; width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #ff69b4; box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 2000; }

        /* เนื้อหาหลัก */
        .main-content { margin-left: 260px; flex: 1; padding: 40px; text-align: center; }
        .product-container { max-width: 650px; margin: auto; background: white; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .gallery-section { margin-top: 30px; display: flex; flex-direction: column; gap: 20px; }
        .gallery-item { background: #fff; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .gallery-item img { width: 100%; border-radius: 10px; }
        .label { font-weight: bold; color: #ff69b4; margin-top: 10px; display: block; font-size: 1.2rem; }

        /* ปุ่มสั่งซื้อและ Popup */
        .chat-widget { position: fixed; bottom: 30px; right: 30px; z-index: 2000; text-align: right; }
        
        .chat-btn { background-color: #ff69b4; color: white; padding: 15px 25px; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); font-weight: bold; display: inline-block; }

        .chat-popup { 
            position: absolute; bottom: 70px; right: 0; background: white; padding: 20px; 
            border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); width: 240px; 
            border: 2px solid #ff69b4; opacity: 0; visibility: hidden; 
            transform: translateY(10px); transition: all 0.4s ease;
        }

        /* เมื่อชี้ที่ widget ให้ Popup แสดงผล */
        .chat-widget:hover .chat-popup { 
            opacity: 1; visibility: visible; transform: translateY(0); 
        }
        
        .contact-link { display: block; color: #ff69b4; text-decoration: none; margin: 10px 0; font-weight: bold; }
    </style>
